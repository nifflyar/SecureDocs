<text x="1200.0" y="561.5000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#805b10">Authentication + tenant /</text>
<text x="1200.0" y="583.1000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#805b10">object permission check</text>
<text x="1200.0" y="604.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#805b10">on every protected action</text>
<text x="1200.0" y="626.3000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#805b10"></text>
<text x="1200.0" y="647.9000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#805b10">Not supplied by role selection</text>
