<text x="1200.0" y="818.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#486581">Manage membership / keys</text>
<text x="1200.0" y="839.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#486581">No implicit approval authority</text>
<text x="47" y="954.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#102a43">Plain lines associate actors with actions. Dashed arrows show required approval order.</text>
<text x="47" y="975.6" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#102a43">The model controls transitions; the shared builder checks state at each browser download.</text>
